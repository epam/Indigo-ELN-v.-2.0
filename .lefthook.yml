glob_matcher: doublestar
pre-commit:
  jobs:
    - name: prettier
      glob: "frontend/src/**/*.{ts,tsx,css}"
      root: "frontend/"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: "frontend/**/*.{ts,tsx}"
      run: cd frontend && pnpm run typecheck
