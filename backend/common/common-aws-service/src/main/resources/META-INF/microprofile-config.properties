quarkus.oidc.roles.role-claim-path="cognito:groups"

# The only authorization in the system. On Lambda this was API Gateway's Cognito authorizer; running
# these images behind plain nginx there is no authorizer, and X-API-Secret only proves the request
# came from the CDN, not who sent it. Without this, any /api/* read endpoint that never reaches
# UserService answers anonymously.
#
# Service-to-service calls also land on /api/* (eln -> signature, eln -> sampleregistration), but
# APISecretHeaderFactory forwards the caller's Authorization header, so they carry the original JWT.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
# Tests authenticate with the X-Test-Authorization header, which UserHolder reads directly and which
# creates no SecurityIdentity - an `authenticated` policy would reject every one of them.
%devtest.quarkus.http.auth.permission.api.policy=permit

# Service-to-service only: not routed by CloudFront, guarded by X-API-Secret, and reports-aws has
# OIDC compiled out entirely, so it cannot authenticate a caller even if one were supplied.
quarkus.http.auth.permission.internal.paths=/internalapi/*
quarkus.http.auth.permission.internal.policy=permit
