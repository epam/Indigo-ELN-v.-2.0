quarkus.package.jar.type=legacy-jar

quarkus.native.enabled=true
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

quarkus.native.resources.includes=reports/*

# Regenerate report classes again; it's done in reports-core, but generated classes are only registered by quarkus-jasperreports in reports-core.
quarkus.jasperreports.build.source=../reports-core/src/main/jasperreports

quarkus.package.jar.enabled=false

quarkus.ssl.native=true
