#quarkus.package.jar.type=legacy-jar

#quarkus.container-image.build=true
quarkus.container-image.build=false
quarkus.native.enabled=true
quarkus.native.container-build=true
#quarkus.native.remote-container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-24
quarkus.native.additional-build-args=--initialize-at-run-time=com.sun.jna
quarkus.package.jar.enabled=false

quarkus.datasource.devservices.port=15434
%integration-test.quarkus.flyway.migrate-at-start=true
%integration-test.quarkus.http.port=8081
quarkus.http.test-port=8081

quarkus.container-image.jib.extra-files[0].path=build/nativelibs
quarkus.container-image.jib.extra-files[0].target-path-in-image=/nativelibs
quarkus.container-image.jib.extra-files[0].permissions=755
#quarkus.container-image.jib.environment-variables.LD_LIBRARY_PATH=/indigolibs/linux-x86_64
quarkus.container-image.jib.environment-variables.NATIVE_LIB_PATH=/indigolibs
