# to run lambda container locally
services:
  postgres:
    image: public.ecr.aws/m5k0g6n7/indigoeln/indigo-eln-postgres:latest
    environment:
      - POSTGRES_USER=quarkus
      - POSTGRES_PASSWORD=quarkus
  eln:
    image: "user/eln-lambda:3.0.0-SNAPSHOT"
    depends_on:
      - postgres
    environment:
      - "QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/quarkus"
      - "QUARKUS_DATASOURCE_USERNAME=quarkus"
      - "QUARKUS_DATASOURCE_PASSWORD=quarkus"
      - "QUARKUS_LOG_CONSOLE_JSON_ENABLED=false"
      - "QUARKUS_HTTP_PORT=8083"
      - "QUARKUS_LOG_LEVEL=trace"
    ports:
      - "8083:8083"
    restart: unless-stopped
