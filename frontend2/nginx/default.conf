server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    client_max_body_size 50m;

    # Keep Location headers on whatever host and port the client used.
    absolute_redirect off;

    # Hashed filenames: safe to cache forever.
    location /frontend2/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # add_header does not inherit into a location that sets its own.
    location = /frontend2/index.html {
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-store" always;
    }

    # SPA deep links are not files.
    location /frontend2/ {
        include /etc/nginx/snippets/csp.conf;
        try_files $uri $uri/ /frontend2/index.html;
    }

    location = / {
        return 302 /frontend2/;
    }
}
