@if (isLoading) {
<div class="flex items-center justify-center py-8">
    <span>Loading notebook...</span>
</div>
} @else if (hasError) {
<div class="flex items-center justify-center py-8">
    <div class="text-center">
        <span>There was an error loading the notebook, please try again later</span>
    </div>
</div>
} @else if (notebook) {
<div class="grid grid-cols-1 gap-4 pt-4">
    <eln-card>
        <div class="px-3">
            <div class="flex items-center justify-between pb-3 border-b border-b-neutral-200">
                <h2 class="font-semibold text-base">About Notebook</h2>
                <eln-button variant="blue-outline" classList="text-primary-400" [disabled]="true">
                    <em class="indicon-edit"></em>
                    Edit
                </eln-button>
            </div>

            <div class="space-y-6 mt-3 text-sm">
                <div>
                    <h3 class="font-semibold text-neutral-800 mb-2">Notebook Name</h3>
                    <input type="text"
                        class="relative inline-flex w-full items-center gap-2 rounded-sm border px-3 py-2 transition-colors duration-200 border-neutral-300 outline-none placeholder:text-neutral-600 text-sm cursor-not-allowed bg-neutral-100 text-neutral-600"
                        [value]="notebook?.name ?? ''" [readonly]="true" [disabled]="true" />
                </div>

                <div>
                    <h3 class="text-neutral-800 mb-2 font-semibold">Notebook Description</h3>
                    <textarea
                        class="w-full rounded-sm border px-3 py-2 transition-colors duration-200 border-neutral-300 outline-none placeholder:text-neutral-600 text-sm cursor-not-allowed bg-neutral-100 text-neutral-600 resize-none min-h-28"
                        [value]="notebook?.description ?? ''" [readonly]="true" [disabled]="true"></textarea>
                </div>

                <!-- TODO: Attachments list and actions -->
            </div>
        </div>
    </eln-card>
</div>
}
