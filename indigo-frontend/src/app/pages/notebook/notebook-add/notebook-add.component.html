<eln-form-dialog
  [title]="'Add Notebook'"
  [fields]="fields"
  [model]="model"
  size="auto"
  containerClass="w-[800px]"
  [contentLoading]="loading"
  [contentError]="loadError"
  [submitFn]="createNotebookFn"
  [toastMessages]="{ uniqueName: uniqueNameToastMessage }"
  submitButtonText="Save"
></eln-form-dialog>
