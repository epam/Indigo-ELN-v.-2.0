<eln-list-header (viewChange)="selectedView = $any($event)" />
<div
  [@viewChange]="selectedView"
  [ngClass]="{
    'grid gap-x-4 mt-5 gap-y-4': true,
    'grid-cols-1': selectedView === 'list',
    'md:grid-cols-2 2xl:grid-cols-3': selectedView === 'grid',
  }"
>
  @for (experiment of (data$ | async) ?? []; track experiment.id) {
    <eln-experiment-item
      [experiment]="experiment"
      [variant]="selectedView"
      [projectId]="projectId"
      [notebookId]="notebookId"
    />
  }
  <eln-infinite-loader
    [classNames]="
      {
        'col-span-1': selectedView == 'list',
        '2xl:col-span-3 md:col-span-2': selectedView == 'grid',
      } | classPicker
    "
    (infiniteLoad)="infiniteLoad()"
    [isLoading]="isLoading"
    (enteredViewport)="onInfiniteLoaderEntered()"
    (leftViewport)="onInfiniteLoaderLeft()"
  />
</div>

<eln-button *projectOverviewWidget="'button'" variant="blue" classList="flex items-center gap-2">
  <em class="text-xl indicon-plus"></em>
  <span class="whitespace-nowrap">Add Experiment</span>
</eln-button>
