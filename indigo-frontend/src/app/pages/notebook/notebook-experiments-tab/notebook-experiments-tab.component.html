<eln-list-header
  [checkboxDropdownPlaceholder]="'Status'"
  [enableFilter]="true"
  [filterOptions]="getFilterOptions()"
  [sortOptions]="headerSortOptions"
  [currentSort]="getCurrentSort()"
  [searchValue]="getSearchValue()"
  [myEntitiesValue]="getBooleanFilterValue('createdByMe')"
  (viewChange)="onViewChange($event)"
  (searchChange)="onSearch($event)"
  (sortChange)="onSortChange($event)"
  (myEntitiesOnlyChange)="onMyEntitiesOnlyChange($event)"
  (filterChange)="onFilterChange($event)"
/>

<div
  [@viewChange]="selectedView"
  [ngClass]="{
    'grid gap-x-4 mt-5 gap-y-4': true,
    'grid-cols-1': selectedView === 'list',
    'md:grid-cols-2 2xl:grid-cols-3': selectedView === 'grid',
  }"
>
  @for (experiment of (data$ | async) ?? []; track experiment.id) {
    <eln-experiment-item [experiment]="experiment" [variant]="selectedView" />
  }

  <eln-infinite-loader
    [classNames]="
      {
        'col-span-1': selectedView == 'list',
        '2xl:col-span-3 md:col-span-2': selectedView == 'grid',
      } | classPicker
    "
    (infiniteLoad)="infiniteLoad()"
    [isLoading]="isLoading"
    (enteredViewport)="onInfiniteLoaderEntered()"
    (leftViewport)="onInfiniteLoaderLeft()"
  />
</div>

<eln-button *projectOverviewWidget="'button'" variant="blue" classList="flex items-center gap-2">
  <em class="text-xl indicon-plus"></em>
  <span class="whitespace-nowrap">Add Experiment</span>
</eln-button>
