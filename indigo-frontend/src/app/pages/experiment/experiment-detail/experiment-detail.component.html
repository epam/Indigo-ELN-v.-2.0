@if (loading) {
  <div class="flex items-center justify-center py-8">
    <span>Loading experiment...</span>
  </div>
} @else if (error) {
  <div class="flex items-center justify-center py-8">
    <div class="text-center">
      <span
        >There was an error loading the experiment, please try again later</span
      >
    </div>
  </div>
} @else {
  <div class="flex items-center mt-6 overflow-x-auto">
    @for (tab of tabs; track tab.link) {
      <eln-project-tab-button [label]="tab.name" [routerLink]="tab.link" />
    }
  </div>
}

<router-outlet />
