<div class="p-4">
  <h2 class="font-semibold text-lg mb-4">Analyze RXN</h2>
  <div class="flex flex-col gap-4">
    <mat-radio-group class="flex flex-wrap gap-4 text-sm" [(ngModel)]="catalog">
      <div class="grow">
        <mat-radio-button value="ALL">All Catalogs</mat-radio-button>
      </div>
      <div class="grow">
        <mat-radio-button value="ELN">Indigo ELN</mat-radio-button>
      </div>
      <div class="grow">
        <mat-radio-button value="PUBCHEM">PubChem</mat-radio-button>
      </div>
      <div class="grow">
        <mat-radio-button value="MY_MATERIALS">My Materials</mat-radio-button>
      </div>
    </mat-radio-group>
  </div>
  <mat-tab-group
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    class="border-t border-[#bbb8b8]/80"
    [selectedIndex]="selectedTab"
  >
    @for (tab of tabs; track $index) {
      <mat-tab [disabled]="tab.loader == null">
        <ng-template mat-tab-label>
          <span [innerHTML]="tab.name"></span>
          @if (tab.loader != null && tab.loader.totalItems != null) {
            <span>({{ tab.loader.totalItems }})</span>
          }
        </ng-template>
        @if (tab.loader != null) {
          <eln-sample-search-results [loader]="tab.loader" (addToExperiment)="addToExperiment(tab, $event)" />
        } @else {
          <div></div>
        }
      </mat-tab>
    }
  </mat-tab-group>

  <div class="flex justify-end mt-2">
    <section>
      <div class="example-button-row">
        <button
          type="button"
          class="ml-2 px-4 py-2 text-[#3F50B5] bg-[#ececec] rounded cursor-pointer"
          (click)="close()"
        >
          Close
        </button>
      </div>
    </section>
  </div>
</div>
