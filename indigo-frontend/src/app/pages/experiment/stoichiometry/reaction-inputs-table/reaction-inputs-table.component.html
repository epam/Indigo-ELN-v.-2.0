<div class="flex justify-between py-1">
  <h3 class="text-sm font-semibold p-3">Reactants, Reagents, Solvents</h3>
  <div class="flex justify-between items-center gap-3">
    Significant Figures :
    <eln-select
      [items]="significantFiguresOptions()"
      [placeholder]="''"
      [ngModel]="model().significantFigures.toString()"
      (selectionChange)="onSignificantFiguresChange($event)"
    >
    </eln-select>

    <eln-button (click)="addMaterial()" variant="grey" matTooltip="Add material">
      <em class="indicon-plus"></em>
    </eln-button>

    <eln-button (click)="addNewRow()" variant="grey" matTooltip="Add empty row">
      <em class="indicon-add"></em>
    </eln-button>
  </div>
</div>
<eln-editable-data-table
  [dataSource]="dataSource()"
  [columns]="columns()"
  [displayedColumns]="displayedColumns()"
  emptyMessage="No material added"
/>
