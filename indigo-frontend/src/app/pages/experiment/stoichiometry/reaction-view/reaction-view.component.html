<div class="flex flex-col gap-4 mt-4">
  @if (reactionScheme()) {
    <div>
      <eln-reaction-scheme-view [experimentId]="experimentId()" [reactionAnchor]="reactionAnchor()" />
    </div>
  }

  @if (reactantsReagentsSolvents()) {
    <div>
      <eln-reaction-inputs-table [experimentId]="experimentId()" [reactionAnchor]="reactionAnchor()" />
    </div>
  }

  @if (intendedProducts()) {
    <div>
      <eln-reaction-products-table [experimentId]="experimentId()" [reactionAnchor]="reactionAnchor()" />
    </div>
  }
</div>
