<!-- Reaction Scheme Section -->
<div class="mb-6">
    <h3 class="text-sm font-medium text-gray-700 mb-3">Reaction Scheme</h3>

    <div
        class="relative border-2 border-dashed border-gray-300 rounded-lg p-8 min-h-32 flex items-center justify-center">
        @if (reactionSchemeImageUrl(); as imageUrl) {
        <eln-api-image [url]="imageUrl" altText="reaction scheme" />
        }
      
        <eln-button [type]="'button'" [variant]="'grey'" (click)="openChemicalEditor()" [classList]="'absolute top-2 right-2 z-10'"
            (keydown.enter)="openChemicalEditor()">
            <mat-icon class="material-icons-outlined text-sm">edit</mat-icon>
        </eln-button>
    </div>
</div>
