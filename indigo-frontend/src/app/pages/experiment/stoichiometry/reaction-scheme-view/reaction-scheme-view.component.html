<!-- Reaction Scheme Section -->
<div class="mb-6">
  <h3 class="text-sm font-medium text-gray-700 mb-3">Reaction Scheme</h3>
  <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-8 min-h-32 flex items-center justify-center">
    @if (reactionSchemeBlob() || reactionSchemeImageUrl()) {
      <eln-api-image [blob]="reactionSchemeBlob()" [url]="reactionSchemeImageUrl()" altText="reaction scheme" />
    }
    <eln-button
      [type]="'button'"
      [variant]="'grey'"
      (click)="openChemicalEditor()"
      [classList]="'absolute top-2 right-2 z-10'"
      (keydown.enter)="openChemicalEditor()"
    >
      <eln-svg icon="scheme/edit" size="small" classList="text-sm" />
    </eln-button>
  </div>
</div>
