<div class="batch-detail-container">

      [batchAnchor]="data().sample.anchor"

  <div class="right-panel">
    <eln-batch-detail-info-panel [sample]="data().sample" [output]="data().output" [reaction]="data().reaction" />
  </div>
</div>
