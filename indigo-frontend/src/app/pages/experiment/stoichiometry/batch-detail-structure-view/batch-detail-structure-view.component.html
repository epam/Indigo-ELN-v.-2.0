<div class="structure-view-container">
  <div class="structure-section">
    <h4 class="text-sm font-semibold mb-3">Structure</h4>
    <div class="structure-image-wrapper">
      @if (imageUrl()) {
        <eln-api-image [url]="imageUrl()!" [altText]="'Batch structure'" class="structure-image" />
      } @else {
        <div class="flex flex-col justify-center items-center h-full text-gray-400">
          <mat-icon class="mb-2">science</mat-icon>
          <span class="text-sm">No structure available</span>
        </div>
      }
    </div>
    <div class="mt-3">
      <eln-button variant="grey" size="sm" (click)="onEditStructure()">
        <mat-icon class="text-sm">edit</mat-icon>
        <span class="ml-1">Edit</span>
      </eln-button>
    </div>
  </div>
</div>
