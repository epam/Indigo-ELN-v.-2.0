<app-modal #addExperimentModal title="Add Experiment" (closed)="close('close')">
    <div class="w-250">
        <form [formGroup]="formGroup" (ngSubmit)="createExperiment()">
            <ng-content #modalContent>
                <app-select label="Select Template" [required]="true" [formControlName]="'template'"
                    [items]=dropdownMenuItem></app-select>
                <label class="flex flex-col gap-2 my-4">
                    <span class="text-lg font-medium">Experiment Details</span>
                </label>
                <app-input label="Experiment Name" placeholder="Experiment Name" [formControlName]="'name'"
                    [required]="true"></app-input>
                @if (formGroup.get('name')?.hasError('required') && isSubmitted) {
                <p class="text-red-500 text-sm mt-1">
                    Experiment Name is required
                </p>
                }


                <div class="flex flex-row space-x-4 my-1">
                    <div class="basis-128">
                        <app-select [formControlName]="'therapeuticArea'" label="Therapeutic Area"
                            [items]="theraputicItem$ | async"></app-select>
                    </div>
                    <div class="basis-128">
                        <app-select [formControlName]="'contFromRxn'" label="Cont. FROM Rxn"
                            [items]=dropdownMenuItem></app-select>
                    </div>
                </div>

                <div class="flex flex-row space-x-4 my-1">
                    <div class="basis-128">
                        <app-select [formControlName]="'projectCode'" label="Project Code & Name"
                            [items]="projectCodeItem$ | async"></app-select>
                    </div>
                    <div class="basis-128"><app-select [formControlName]="'contToRxn'" label="Cont. TO Rxn"
                            [items]=dropdownMenuItem></app-select></div>
                </div>

                <div class="flex flex-row space-x-4 my-1">
                    <div class="basis-128"><app-input label="Co-authors" [formControlName]="'coAuthors'"
                            placeholder="Text"></app-input></div>
                    <div class="basis-128"> <label class="flex flex-col gap-2 my-1" for="linkedExperiments">
                            <span class="text-sm font-medium">Linked Experiment</span>
                        </label>
                        <div class="border rounded-lg shadow-md">
                            <div class="flex flex-wrap gap-2">
                                @for (chip of linkedExperiments; track chip; let i = $index) {
                                    <app-chip
                                        (emitClose)="removeChip(i, 'linkedExperiments')"
                                        [deleteable]="true"
                                        [active]="true"
                                    >
                                        {{ chip }}
                                    </app-chip>
                                }
                                <input [formControlName]="'linkedExperiments'" placeholder="Type and press enter"
                                    (keydown.enter)="addChip($event, 'linkedExperiments')"
                                    class="p-2 border rounded outline-none focus:ring-2 focus:ring-blue-400" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-row space-x-4 my-1">
                    <div class="basis-128"> <label class="flex flex-col gap-2 my-1" for="batchCreators">
                            <span class="text-sm font-medium">Batch Creator</span>
                        </label>
                        <div class="border rounded-lg shadow-md">
                            <div class="flex flex-wrap gap-2">
                                @for (chip of batchCreators; track chip; let i = $index) {
                                <app-chip
                                        (emitClose)="removeChip(i, 'batchCreators')"
                                        [deleteable]="true"
                                        [active]="true"
                                    >
                                        {{ chip }}
                                    </app-chip>
                                }
                                <input [formControlName]="'batchCreators'"
                                    (keydown.enter)="addChip($event, 'batchCreators')"
                                    placeholder="Type and press enter"
                                    class="p-2 border rounded outline-none focus:ring-2 focus:ring-blue-400" />
                            </div>
                        </div>
                    </div>
                    <div class="basis-128"><app-input label="Project Alias Name" [formControlName]="'projectAlias'"
                            placeholder="Text"></app-input></div>
                </div>

                <app-input label="Literature" placeholder="Text" [formControlName]="'literature'"></app-input>




            </ng-content>
            <ng-content #modalFooter>
                <div class="flex justify-end space-x-2 mt-3">
                    <app-button [type]="'button'" [variant]="'grey'" (click)="close('cancel')">Cancel</app-button>
                    <app-button [type]="'button'" [variant]="'blue'" (click)="createExperiment()">Add
                        Experiment</app-button>
                </div>
            </ng-content>
        </form>
    </div>
</app-modal>
