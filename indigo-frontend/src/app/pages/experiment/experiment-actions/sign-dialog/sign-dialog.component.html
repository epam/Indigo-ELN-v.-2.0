<eln-form-dialog
  title="Select Signature Template"
  submitButtonText="Sign"
  [fields]="fields"
  [submitEnabled]="!loading()"
  (formSubmit)="onSubmit($event)"
>
  @if (loading()) {
    <ng-template #modalContent>
      <div class="flex justify-center items-center py-8">
        <mat-spinner diameter="40" />
      </div>
    </ng-template>
  }
</eln-form-dialog>
