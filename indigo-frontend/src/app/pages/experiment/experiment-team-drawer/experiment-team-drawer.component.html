<div class="flex flex-col h-full">
  <div class="flex-1 overflow-y-auto p-4 [&_eln-card>div]:!border-0 [&_eln-card>div]:!p-0">
    @if (experiment()) {
      <eln-team
        [entityId]="experiment().id"
        [team]="experiment().acl || []"
        [config]="teamConfig"
        [showHeader]="false"
        (teamChanged)="onTeamChanged($event)"
      />
    }
  </div>
</div>
