<eln-modal #addProjectModal title="Add Project" (closed)="close('close')">
  <div class="w-xl">
    <form [formGroup]="formGroup" (ngSubmit)="createProject()">
      <ng-content #modalContent>
        <eln-input
          label="Project Name"
          placeholder="Project Name"
          [formControlName]="'name'"
          [required]="true"
        ></eln-input>
        @if (formGroup.get('name')?.hasError('required') && isSubmitted) {
          <p class="text-red-500 text-sm mt-1">Email is required</p>
        }

        <label class="flex flex-col gap-2 my-1" for="keywords">
          <span class="text-sm font-medium">Keywords</span>
        </label>
        <div class="w-xl p-4 border rounded-lg shadow-md">
          <div class="flex flex-wrap gap-2">
            @for (chip of chips; track chip; let i = $index) {
              <eln-chip
                (emitClose)="removeChip(i)"
                [deleteable]="true"
                [active]="true"
              >
                {{ chip }}
              </eln-chip>
            }
            <div>
              <input
                [formControlName]="'keywords'"
                (keydown.enter)="addChip($event)"
                class="p-2 border rounded outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="Project Keywords"
              />
            </div>
          </div>
        </div>
        <eln-input
          label="Literature"
          placeholder="Literature"
          [formControlName]="'literature'"
        ></eln-input>
        <eln-input
          label="Project Description"
          placeholder="Project Description"
          [formControlName]="'description'"
        ></eln-input>
        <label class="flex flex-col gap-2 my-1">
          <span class="text-sm font-medium"> Attachments </span>
        </label>
        <eln-file-upload
          [maxSizeMB]="5"
          (filesSelected)="onFilesUploaded($event)"
        ></eln-file-upload>
      </ng-content>
      <ng-content #modalFooter>
        <div class="flex justify-end space-x-2 mt-3">
          <eln-button
            [type]="'button'"
            [variant]="'grey'"
            (click)="close('cancel')"
            >Cancel</eln-button
          >
          <eln-button
            [type]="'button'"
            [variant]="'blue'"
            (click)="createProject()"
            >Add Project</eln-button
          >
        </div>
      </ng-content>
    </form>
  </div>
</eln-modal>
