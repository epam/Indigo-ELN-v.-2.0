<eln-list-header
  [sortOptions]="headerSortOptions"
  [currentSort]="getCurrentSort()"
  (viewChange)="onViewChange($event)"
  (searchChange)="onSearch($event)"
  (sortChange)="onSortChange($event)"
  (myEntitiesOnlyChange)="onMyEntitiesOnlyChange($event)"
/>

<div
  [@viewChange]="selectedView"
  [ngClass]="{
    'grid gap-x-4 mt-5 gap-y-4': true,
    'grid-cols-1': selectedView === 'list',
    'md:grid-cols-2 2xl:grid-cols-3': selectedView === 'grid',
  }"
>
  @for (project of (data$ | async) ?? []; track project.id) {
    <eln-project-item [project]="project" [variant]="selectedView" />
  }
  <eln-infinite-loader
    [classNames]="
      {
        'col-span-1': selectedView == 'list',
        '2xl:col-span-3 md:col-span-2': selectedView == 'grid',
      } | classPicker
    "
    (enteredViewport)="onInfiniteLoaderEntered()"
    (leftViewport)="onInfiniteLoaderLeft()"
    (infiniteLoad)="infiniteLoad()"
    [isLoading]="isLoading"
  />
</div>

<eln-button
  *projectOverviewWidget="'button'"
  variant="blue"
  classList="flex items-center gap-2"
  (click)="openModal()"
  [disabled]="!canCreateProject()"
>
  <em class="text-xl indicon-plus"></em>
  <span class="whitespace-nowrap">Add Project</span>
</eln-button>
