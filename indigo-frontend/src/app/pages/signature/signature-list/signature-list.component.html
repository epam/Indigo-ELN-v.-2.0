<eln-list-header
  [sortOptions]="headerSortOptions"
  [currentSort]="getCurrentSort()"
  (searchChange)="onSearch($event)"
  (sortChange)="onSortChange($event)"
/>
<div
  *ngIf="data$ | async as data"
  [ngClass]="{
    'grid gap-x-4 mt-5 gap-y-4': true,
    'grid-cols-1': true,
    'md:grid-cols-2 2xl:grid-cols-3': false,
  }"
>
  @for (document of data; track document.id) {
    <eln-signature-item [document]="document" />
  }
  <eln-infinite-loader
    [classNames]="
      {
        'col-span-1': true,
        '2xl:col-span-3 md:col-span-2': false,
      } | classPicker
    "
    (infiniteLoad)="infiniteLoad()"
    [isLoading]="isLoading"
  />
</div>
