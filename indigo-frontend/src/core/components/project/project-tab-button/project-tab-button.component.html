<a
  [class]="
    [
      'p-3 md:p-4 text-primary-400 whitespace-nowrap h-[56px]',
      'cursor-pointer',
      className,
    ] | twsx
  "
  [routerLink]="routerLink"
  routerLinkActive="border-b-primary-400 border-b-2"
  [routerLinkActiveOptions]="{
    queryParams: 'ignored',
    matrixParams: 'exact',
    paths: 'exact',
    fragment: 'exact',
  }"
  (click)="clicked.emit()"
  [class.border-b-primary-400]="active"
  [class.border-b-2]="active"
  >{{ label }}
</a>
