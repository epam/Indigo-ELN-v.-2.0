<a
  [class]="
    [
      'p-3 md:p-4 text-primary-400 whitespace-nowrap',
      'cursor-pointer',
      className,
    ] | twsx
  "
  [routerLink]="routerLink"
  routerLinkActive="border-b-primary-400 border-b-2"
  (click)="clicked.emit()"
  [class.border-b-primary-400]="active"
  [class.border-b-2]="active"
  >{{ label }}
</a>
