<div #parent class="field-wrapper">
  <!-- don't put under @if, it should exist for @ViewChild to work -->
  <input
    #editNumber
    type="number"
    class="field-input"
    [ngClass]="{
      'w-full': !showUnits,
      'w-6/10': showUnits,
    }"
    [hidden]="!editing"
    [value]="value?.value | number: '1.0-3'"
    (blur)="inputBlur($event)"
    (keydown.enter)="stopEditing('_notmodified')"
    (keydown.escape)="cancelEditing()"
  />
  @if (showUnits) {
    <div class="w-4/10" [hidden]="!editing">
      <mat-select #editUnits class="field-select" [value]="value?.unit" (selectionChange)="stopEditing($event.value)">
        @for (unit of units; track unit.value) {
          <mat-option [value]="unit.value">{{ unit.displayName }}</mat-option>
        }
      </mat-select>
    </div>
  }
  @if (!editing) {
    <span
      #span
      class="field-display"
      [ngClass]="{
        'cursor-pointer': !readOnly,
        'text-blue-500': !readOnly,
      }"
      (click)="startEditing()"
    >
      @if (value == null) {
        &ndash;
      } @else {
        {{ value.value | number: '1.0-3' }}
        @if (showUnits) {
          {{ ' ' + (unitDisplayName ?? '') }}
        }
      }
    </span>
  }
</div>
