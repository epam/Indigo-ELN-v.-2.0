<!-- Reaction Scheme Section -->
<div class="mb-6">
    <h3 class="text-sm font-medium text-gray-700 mb-3">Reaction Scheme</h3>
    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center bg-gray-50 min-h-32">
        <div class="text-gray-500">
            <p class="mb-4">No data model loaded yet</p>
            <eln-button 
                [type]="'button'" 
                [variant]="'blue'"
                (click)="openChemicalEditor()">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Open Editor
            </eln-button>
        </div>
    </div>
</div>
