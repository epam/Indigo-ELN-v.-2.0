<form [formGroup]="form">
  <div>
    @if (multiple) {
      <eln-autocomplete-select
        formControlName="multiple"
        [search]="search.bind(this)"
        [display]="displayFn"
        [allowEmptySearch]="true"
      >
        <ng-template #optionTemplate let-item>
          <span class="font-medium text-gray-900">{{ item.name }}</span>
        </ng-template>
      </eln-autocomplete-select>
    } @else {
      <div class="border">
        <eln-dropdown-value
          formControlName="single"
          [options]="allItems$ | async"
          class="border"
        />
      </div>
    }
  </div>
</form>
