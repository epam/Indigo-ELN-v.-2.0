<div
  #dropdownContainer
  class="dd-container relative text-sm"
  [class.opacity-50]="disabled"
  [class.pointer-events-none]="disabled"
>
  <div
    class="dd-trigger relative inline-flex items-center gap-2 rounded-lg px-3 py-2 transition-colors duration-200 cursor-pointer select-none hover:bg-primary-100 active:bg-primary-100"
    [class.bg-primary-100]="isOpen"
    (click)="toggleDropdown($event)"
  >
    <span>{{ placeholder }}</span>
    <em
      *ngIf="!disabled"
      class="indicon-chevron_down ml-auto transition-transform duration-200"
      [class.rotate-180]="isOpen"
    ></em>
  </div>

  @if (isOpen) {
    <ul
      #dropdownList
      [@dropdownAnimation]
      class="absolute right-0 top-full mt-1 min-w-[224px] py-1 bg-neutral border border-neutral-300 rounded-lg shadow-lg z-50 whitespace-nowrap"
    >
      @for (item of items; track item) {
        <li
          class="px-3 py-2 flex items-center gap-2 text-neutral-1000 text-sm hover:bg-neutral-100 active:bg-neutral-200 cursor-pointer"
          (click)="toggleItemSelection(item)"
        >
          <input
            type="checkbox"
            [checked]="item.checked"
            (click)="$event.stopPropagation()"
            (change)="toggleItemSelection(item)"
            class="w-4 h-4 rounded cursor-pointer border-neutral-300 text-primary-400 accent-primary-400"
          />
          <span class="flex-1 truncate">{{ item.label }}</span>
        </li>
      }
    </ul>
  }
</div>
