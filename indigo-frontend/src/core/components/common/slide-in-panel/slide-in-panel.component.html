@if (isOpen()) {
  <div
    class="fixed inset-0 z-40 transition-opacity duration-300 bg-black/20"
    [style.top]="topOffset()"
    (click)="onBackdropClick()"
  ></div>
}

<div
  class="fixed right-0 bg-white z-50 shadow-2xl flex flex-col transition-transform duration-300 ease-in-out"
  [style.top]="topOffset()"
  [style.width]="width()"
  [style.height]="'calc(100vh - ' + topOffset() + ')'"
  [class.translate-x-0]="isOpen()"
  [class.translate-x-full]="!isOpen()"
  [class.invisible]="!isVisible()"
>
  @if (header()) {
    <div class="flex items-center justify-between p-4 border-b border-neutral-200 shrink-0">
      <div class="flex items-center gap-2">
        <ng-container [ngTemplateOutlet]="header()" />
      </div>
      <button
        type="button"
        class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-neutral-100 transition-colors"
        (click)="close()"
        aria-label="Close"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
  <div class="flex-1 min-h-0 overflow-auto">
    <ng-template #contentOutlet></ng-template>
  </div>
</div>
