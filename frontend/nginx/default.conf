server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    client_max_body_size 50m;

    # Keep Location headers on whatever host and port the client used.
    absolute_redirect off;

    # Hashed filenames: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Per-environment settings, mounted at deploy time rather than baked in, so it must never be
    # cached. Returns 404 when nothing is mounted, which surfaces as a failed boot rather than a
    # silently wrong provider. add_header does not inherit into a location that sets its own,
    # which is why the CSP snippet is repeated below.
    location = /config.json {
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-store" always;
    }

    # index.html must never be cached, or a deploy serves stale asset refs.
    location = /index.html {
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-store" always;
    }

    # SPA deep links are not files.
    location / {
        include /etc/nginx/snippets/csp.conf;
        try_files $uri $uri/ /index.html;
    }
}
