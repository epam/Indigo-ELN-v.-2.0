version: 0.2
env:
  # CodeBuild's default shell is sh (dash on the standard images), which has no `pipefail`.
  shell: bash
phases:
  install:
    runtime-versions:
      java: corretto25
  pre_build:
    commands:
      # Fail loudly if env.shell did not take effect: under dash `set -eo pipefail` errors but
      # execution carries on *without* `set -e`, silently disabling error propagation.
      - '[ -n "$BASH_VERSION" ] || { echo "this buildspec needs bash - check env.shell" >&2; exit 1; }'
      - set -eo pipefail
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - set -eo pipefail
      - cd backend
      - |
        TARGETS=":common:common:build"
        if [ "$BUILD_ELN_LAMBDA" = "true" ]; then TARGETS="$TARGETS :common:common-lambda:build :eln:eln-api:build :eln:eln-core:build :eln:eln-lambda:build"; fi
        if [ "$BUILD_REPORTS_LAMBDA" = "true" ]; then TARGETS="$TARGETS :common:common-lambda:build :reports:reports-api:build :reports:reports-core:build :reports:reports-lambda:build"; fi
        if [ "$BUILD_SIGNATURE_LAMBDA" = "true" ]; then TARGETS="$TARGETS :common:common-lambda:build :signature:signature-api:build :signature:signature-core:build :signature:signature-lambda:build"; fi
        if [ "$BUILD_SAMPLEREGISTRATION_LAMBDA" = "true" ]; then TARGETS="$TARGETS :common:common-lambda:build :sampleregistration:sampleregistration-api:build :sampleregistration:sampleregistration-core:build :sampleregistration:sampleregistration-lambda:build"; fi
        if [ "$BUILD_ELN_AWS" = "true" ]; then TARGETS="$TARGETS :common:common-aws-service:build :eln:eln-api:build :eln:eln-core:build :eln:eln-core-aws:build :eln:eln-aws:build"; fi
        if [ "$BUILD_REPORTS_AWS" = "true" ]; then TARGETS="$TARGETS :common:common-aws-service:build :reports:reports-api:build :reports:reports-core:build :reports:reports-aws:build"; fi
        if [ "$BUILD_SIGNATURE_AWS" = "true" ]; then TARGETS="$TARGETS :common:common-aws-service:build :signature:signature-api:build :signature:signature-core:build :signature:signature-aws:build"; fi
        if [ "$BUILD_SAMPLEREGISTRATION_AWS" = "true" ]; then TARGETS="$TARGETS :common:common-aws-service:build :sampleregistration:sampleregistration-api:build :sampleregistration:sampleregistration-core:build :sampleregistration:sampleregistration-aws:build"; fi
        ./gradlew test $TARGETS sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  post_build:
    commands:
      # One command, so the login and the helper are in scope for every branch. That also means
      # CodeBuild only sees this block's final exit status, hence `set -e`: without it a failed tag
      # or push in the middle would be swallowed and the build would report success.
      - |
        set -eo pipefail

        # Every private repo lives in the account's single registry, so one login covers all eight.
        # pipefail is what makes a failing get-login-password fail the build rather than being
        # masked by docker login's own exit status.
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY_URI"

        # Publish a locally built image to its repository under both :latest and the commit tag.
        # First argument is the build flag, so a disabled service is simply skipped.
        push_image() {
          enabled="$1"; local_tag="$2"; repo="$3"
          [ "$enabled" = "true" ] || return 0
          echo "==> $local_tag -> $repo:{latest,$IMAGE_TAG}"
          docker tag "$local_tag" "$repo:latest"
          docker tag "$local_tag" "$repo:$IMAGE_TAG"
          docker push "$repo:latest"
          docker push "$repo:$IMAGE_TAG"
        }

        push_image "$BUILD_ELN_LAMBDA"                indigoeln/eln-lambda:built                 "$ELN_REPO_URI"
        push_image "$BUILD_REPORTS_LAMBDA"            indigoeln/reports-lambda:built             "$REPORTS_REPO_URI"
        push_image "$BUILD_SIGNATURE_LAMBDA"          indigoeln/signature-lambda:built           "$SIGNATURE_REPO_URI"
        push_image "$BUILD_SAMPLEREGISTRATION_LAMBDA" indigoeln/sampleregistration-lambda:built  "$SAMPLEREGISTRATION_REPO_URI"
        push_image "$BUILD_ELN_AWS"                   indigoeln/eln-aws:built                    "$ELN_AWS_REPO_URI"
        push_image "$BUILD_REPORTS_AWS"               indigoeln/reports-aws:built                "$REPORTS_AWS_REPO_URI"
        push_image "$BUILD_SIGNATURE_AWS"             indigoeln/signature-aws:built              "$SIGNATURE_AWS_REPO_URI"
        push_image "$BUILD_SAMPLEREGISTRATION_AWS"    indigoeln/sampleregistration-aws:built     "$SAMPLEREGISTRATION_AWS_REPO_URI"
reports:
  unit_tests:
    files:
      - backend/**/build/test-results/test/TEST-*.xml
    file-format: JUNITXML
  integration_tests:
    files:
      - backend/**/build/test-results/quarkusIntTest/TEST-*.xml
    file-format: JUNITXML
