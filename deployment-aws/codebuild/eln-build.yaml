version: 0.2
phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - env
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - cd backend
      - ./gradlew :common:common:build :common:common-lambda:build :eln:eln-api:build :eln:eln-core:build :eln:eln-lambda:build --info --profile
  post_build:
    commands:
      - docker tag indigoeln/eln-lambda:built $ELN_REPO_URI:latest
      - docker tag indigoeln/eln-lambda:built $ELN_REPO_URI:$IMAGE_TAG
      - docker push $ELN_REPO_URI:latest
      - docker push $ELN_REPO_URI:$IMAGE_TAG
      - tar czf build_profile_$IMAGE_TAG.tgz build/reports/profile
      - echo "aws s3 cp build_profile_$IMAGE_TAG.tgz s3://$S3_LOGS/build_profile_$IMAGE_TAG.tgz"
      - aws s3 cp build_profile_$IMAGE_TAG.tgz s3://$S3_LOGS/build_profile_$IMAGE_TAG.tgz
reports:
  unit_tests:
    files:
      - backend/**/build/test-results/test/TEST-*.xml
    file-format: JUNITXML
  integration_tests:
    files:
      - backend/**/build/test-results/quarkusIntTest/TEST-*.xml
    file-format: JUNITXML
