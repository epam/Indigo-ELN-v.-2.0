version: 0.2
phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - env
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - cd backend
      - ./gradlew test build :eln:eln-lambda:quarkusIntTest :reports:reports-lambda:quarkusIntTest
      - cd eln/eln-lambda
      - docker build -t $ELN_REPO_URI:latest .
      - docker tag $ELN_REPO_URI:latest $ELN_REPO_URI:$IMAGE_TAG
  post_build:
    commands:
      - docker push $ELN_REPO_URI:latest
      - docker push $ELN_REPO_URI:$IMAGE_TAG
reports:
  unit_tests:
    files:
      - backend/**/build/test-results/test/TEST-*.xml
    file-format: JUNITXML
  integration_tests:
    files:
      - backend/**/build/test-results/quarkusIntTest/TEST-*.xml
    file-format: JUNITXML
