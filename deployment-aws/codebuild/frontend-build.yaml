version: 0.2
env:
  # bash rather than CodeBuild's default sh (dash), consistently across every buildspec.
  shell: bash
phases:
  install:
    runtime-versions:
      # The major frontend/.nvmrc pins; CodeBuild takes a major only and picks the patch itself.
      nodejs: 24
  build:
    commands:
      # Fail loudly if env.shell did not take effect: under dash `set -eo pipefail` errors but
      # execution carries on *without* `set -e`, silently disabling error propagation.
      - '[ -n "$BASH_VERSION" ] || { echo "this buildspec needs bash - check env.shell" >&2; exit 1; }'
      - set -eo pipefail
      - cd frontend
      # pnpm at the version package.json's `packageManager` pins.
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm run format:check
      - pnpm run build
      - pnpm run check:bundle
      # After the build: tsc needs the src/routeTree.gen.ts that only vite emits.
      - pnpm run typecheck
      - pnpm run lint
      - pnpm run test:unit --coverage
      # --with-deps installs Chromium's system libraries through apt, which needs root.
      - pnpm exec playwright install --with-deps chromium
      - pnpm run test:stories
      # Reads frontend/sonar-project.properties; SONAR_HOST_URL and SONAR_TOKEN come from the
      # CodeBuild project's environment (BuildStack.java).
      - pnpm dlx @sonar/scan@5.0.0
artifacts:
  files:
    - '**/*'
  base-directory: frontend/dist
