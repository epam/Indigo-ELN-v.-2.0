# Ingress for the EC2 compose stack. Reached only by CloudFront: the instance security group allows
# port 80 from the com.amazonaws.global.cloudfront.origin-facing prefix list and nothing else.
#
# Unlike the local dev config there is no `location /` — the SPA is served from S3 by CloudFront, and
# proxying to a non-existent `frontend` upstream would stop nginx from starting.
#
# X-API-Secret is passed through rather than injected. CloudFront supplies it on /api/* as an origin
# custom header, and services calling each other over /internalapi/* supply it themselves via
# APISecretHeaderFactory. Passing through means a request that somehow reached this port without the
# header is rejected by APISecretFilter instead of being handed the secret for free.
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location /api/eln/ {
        proxy_pass http://eln-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Secret $http_x_api_secret;
    }
    location /internalapi/eln/ {
        proxy_pass http://eln-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Secret $http_x_api_secret;
    }
    location /openapi/eln/ {
        proxy_pass http://eln-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /swagger/eln/ {
        proxy_pass http://eln-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/signature/ {
        proxy_pass http://signature-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Secret $http_x_api_secret;
    }
    location /openapi/signature/ {
        proxy_pass http://signature-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /swagger/signature/ {
        proxy_pass http://signature-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internalapi/reports/ {
        proxy_pass http://reports-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Secret $http_x_api_secret;
    }

    location /api/sampleregistration/ {
        proxy_pass http://sampleregistration-aws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Secret $http_x_api_secret;
    }
}
