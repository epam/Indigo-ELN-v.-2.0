services:

  frontend:
    image: "indigoeln/frontend:built"
    build:
      context: ./../indigo-frontend
      dockerfile: Dockerfile
    environment:
      - KEYCLOAK_URL=http://localhost:8088
      - KEYCLOAK_REALM=indigo-eln
      - KEYCLOAK_CLIENT_ID=frontend-client

  eln-service:
    image: "indigoeln/eln-service:built"
    platform: linux/amd64
    build:
      context: ./../backend/eln/eln-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE}
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/eln"
      QUARKUS_DATASOURCE_USERNAME: eln
      QUARKUS_DATASOURCE_PASSWORD: eln
      ELN_API_SECRET: secret
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8080/realms/indigo-eln"
      QUARKUS_OIDC_CLIENT_ID: indigo-eln-client
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: "protocol/openid-connect/certs"
      QUARKUS_OIDC_TOKEN_ISSUER: "any"
      QUARKUS_TLS_TRUST_ALL: true
      QUARKUS_REST_CLIENT_SIGNATURE_API_URL: "http://nginx:80/"
      QUARKUS_REST_CLIENT_REPORTS_API_URL: "http://nginx:80/"
      QUARKUS_LOG_CONSOLE_JSON_ENABLED: false
      QUARKUS_LOG_CONSOLE_FORMAT: "[ELN] %d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
      QUARKUS_LOG_LEVEL: INFO # DEBUG
#      QUARKUS_REST_CLIENT_LOGGING_SCOPE: "request-response"
#      QUARKUS_REST_CLIENT_LOGGING_BODY_LIMIT: "9999"
#      QUARKUS_REST_CLIENT_EXTENSIONS_API_SCOPE: "all"
#      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dquarkus.profile=dev"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      keycloak-config-cli:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "10020:8080"
#      - "10021:5005"

  reports-service:
    image: "indigoeln/reports-service:built"
    build:
      context: ./../backend/reports/reports-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE}
      ELN_API_SECRET: secret
      QUARKUS_LOG_CONSOLE_JSON_ENABLED: false
      QUARKUS_LOG_CONSOLE_FORMAT: "[REPORTS] %d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
      QUARKUS_LOG_LEVEL: INFO # DEBUG
    #      QUARKUS_LOG_CATEGORY__NET_SF_JASPERREPORTS__LEVEL: INFO
    #      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007 -Dquarkus.profile=devtest"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "10040:8080"
  #      - "10041:5007"

  signature-service:
    image: "indigoeln/signature-service:built"
    build:
      context: ./../backend/signature/signature-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE}
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/signature"
      QUARKUS_DATASOURCE_USERNAME: signature
      QUARKUS_DATASOURCE_PASSWORD: signature
      ELN_API_SECRET: secret
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8080/realms/indigo-eln"
      QUARKUS_OIDC_CLIENT_ID: indigo-eln-client
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: "protocol/openid-connect/certs"
      QUARKUS_OIDC_TOKEN_ISSUER: "any"
      QUARKUS_TLS_TRUST_ALL: true
      ELN_SIGNATURE_KEYSTORE_PASSWORD: "1234"
      QUARKUS_LOG_CONSOLE_JSON_ENABLED: false
      QUARKUS_LOG_CONSOLE_FORMAT: "[SIGNATURE] %d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
      QUARKUS_REST_CLIENT_ELN_INTERNAL_API_URL: "http://nginx:80/"
      QUARKUS_LOG_LEVEL: INFO # DEBUG
#      QUARKUS_REST_CLIENT_LOGGING_SCOPE: "request-response"
#      QUARKUS_REST_CLIENT_LOGGING_BODY_LIMIT: "9999"
#      QUARKUS_REST_CLIENT_EXTENSIONS_API_SCOPE: "all"
#      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006 -Dquarkus.profile=devtest"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      keycloak-config-cli:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "10030:8080"
#      - "10031:5006"

  postgres:
    image: indigo-eln-postgres:built
    platform: linux/amd64
    build:
      context: ./../backend/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - "./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 60s
      interval: 10s
      retries: 3
      start_interval: 1s

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: start-dev --health-enabled=true --log-level=ERROR 
    environment:
      KC_DB: postgres
      KC_HOSTNAME: localhost
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_MANAGEMENT_PORT: 9005
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    ports:
      - "8088:8080"
      - "9005:9005"

  keycloak-healthcheck:
    image: alpine:latest
    depends_on:
      - keycloak
    entrypoint: >
      /bin/sh -c "
      while ! wget -q -O- http://keycloak:9005/health/started; do
        echo waiting for keycloak;
        sleep 1;
      done;
      echo keycloak is up;
      tail -f /dev/null      
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://keycloak:9005/health/ready || (echo 'Health check failed' >> /var/log/healthcheck.log && exit 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./healthcheck.log:/var/log/healthcheck.log

  keycloak-config-cli:
    image: quay.io/adorsys/keycloak-config-cli:6.4.0-26.1.0
    depends_on:
      - keycloak-healthcheck
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: true
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 150s
      IMPORT_VARSUBSTITUTION_ENABLED : true
      IMPORT_FILES_LOCATIONS: '/config/realm-config.json'
    volumes:
      - ./keycloak-config-cli/realm-config.json:/config/realm-config.json

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - eln-service
      - signature-service
      - reports-service
