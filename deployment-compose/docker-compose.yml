services:

  frontend:
    image: "frontend:development"
    build:
      context: ./../indigo-frontend
      dockerfile: Dockerfile
    environment:
      - KEYCLOAK_URL=http://localhost:8088
      - KEYCLOAK_REALM=indigo-eln
      - KEYCLOAK_CLIENT_ID=frontend-client
    ports:
      - "8080:4200"


  eln-core:
    image: "eln-core:development"
    build:
      context: ./../backend/eln/eln-core
      dockerfile: Dockerfile
    command: sh -c "sleep 60 && /opt/jboss/container/java/run/run-java.sh"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/eln"
      QUARKUS_DATASOURCE_USERNAME: eln
      QUARKUS_DATASOURCE_PASSWORD: eln
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://localhost:8088/realms/indigo-eln2"
      QUARKUS_OIDC_CLIENT_ID: indigo-eln-client
      QUARKUS_TLS_TRUST_ALL: true
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dquarkus.profile=devtest"
    #depends_on:
    #  - postgres
    #     condition: service_healthy
    #     restart: true
    #  keycloak:
    #    condition: service_healthy
    #    restart: true
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready" ]
    #  interval: 10s
    #  timeout: 5s
    #  retries: 3
    #  start_period: 30s
    ports:
      - "10020:8080"
      - "10021:5005"

  #  whoami:
  #    image: containous/whoami
  #
  postgres:
    #image: "public.ecr.aws/m5k0g6n7/indigoeln/indigo-eln-postgres:latest"
    image: indigo-eln-postgres:latest
    build:
      context: ./../backend/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - "./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 60s
      interval: 10s
      retries: 3
      start_interval: 1s

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KC_DB: postgres
      KC_HOSTNAME: localhost
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      start_period: 120s
      start_interval: 1s
    ports:
      - "8088:8080"
      #- "8443:8443"

  keycloak-config-cli:
    image: quay.io/adorsys/keycloak-config-cli:6.4.0-26.1.0
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: true
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 150s
      IMPORT_VARSUBSTITUTION_ENABLED : true
      IMPORT_FILES_LOCATIONS: '/config/realm-config.json'
    volumes:
      - ./keycloak-config-cli/realm-config.json:/config/realm-config.json

  traefik:
    image: traefik:v3.3
    ports:
      - "80:80"
      - "8090:8090"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro"
      - "./traefik/services.yaml:/etc/traefik/services.yaml:ro"
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
